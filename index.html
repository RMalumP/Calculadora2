<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Electoral</title>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/header-tabs.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/otros-drag-responsive.css">
  <link rel="stylesheet" href="css/advanced.css">
</head>
<body>

<!-- ══ HEADER ══ -->
<header>
  <h1>Calculadora Electoral</h1>
  <span>Sistemas de representación electoral</span>
  <select id="seat-rename" onchange="updateSeatNames()" style="background:none;border:1px solid #4a3f3a;border-radius:var(--radius);color:#7a6f6a;font-size:0.7rem;padding:3px 6px;cursor:pointer;margin-left:auto;margin-right:8px">
    <option value="escaños">Escaños</option>
    <option value="parlamentarios">Parlamentarios</option>
    <option value="diputados">Diputados</option>
    <option value="concejales">Concejales</option>
    <option value="congresistas">Congresistas</option>
  </select>
  <button class="save-icon-btn" onclick="saveHTML()" title="Guardar HTML con los datos actuales">💾</button>
</header>

<!-- ══ TABS ══ -->
<div class="tabs-container">
  <button class="tab active" data-tab="calculator"  onclick="switchTab('calculator')">Calculadora</button>
  <button class="tab"        data-tab="pactometer"  onclick="switchTab('pactometer')">Pactómetro</button>
  <button class="tab"        data-tab="advanced"    onclick="switchTab('advanced')">Calculadora avanzada</button>
  <button class="tab"        data-tab="theory"      onclick="switchTab('theory')">Teoría</button>
</div>

<div class="main">

  <!-- El contenido de cada pestaña vive en tabs/ y lo inyecta js/tabs.js -->

</div><!-- /main -->

<!-- ══ PESTAÑAS: registro (js/tabs.js) y marcado de cada sección ══ -->
<script src="js/tabs.js"></script>
<script src="tabs/calculadora.js"></script>
<script src="tabs/pactometro.js"></script>
<script src="tabs/avanzada.js"></script>
<script src="tabs/teoria.js"></script>

<!-- ══ SCRIPTS (orden de dependencias) ══ -->
<script src="js/helpers.js"></script>
<script src="js/constants.js"></script>
<script src="js/algorithms.js"></script>
<script src="js/groupings.js"></script>
<script src="js/rows.js"></script>
<script src="js/totals.js"></script>
<script src="js/calculator.js"></script>
<script src="js/hemicycle.js"></script>
<script src="js/pactometer.js"></script>
<script src="js/advanced-data.js?v=7"></script>
<script src="js/advanced-calc.js?v=7"></script>
<script src="js/advanced-ui.js?v=7"></script>
<script src="js/ui.js"></script>

</body>
</html>
